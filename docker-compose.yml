services:
  neo4j:
    image: neo4j:5-community
    container_name: kg_neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: