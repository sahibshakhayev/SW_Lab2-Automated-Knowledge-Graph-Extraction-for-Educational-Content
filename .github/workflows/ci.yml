name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Unit Tests & Code Checks
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend Unit Tests (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

  # ---------------------------------------------------------------------------
  # 2. Frontend Lint & Build Check
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ---------------------------------------------------------------------------
  # 3. Docker Compose Dev Validation & Integration Check (Neo4j + Backend + Frontend)
  # ---------------------------------------------------------------------------
  build-and-test-docker-dev:
    name: Integration Test (Dev Stack)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dev Containers
        run: |
          docker compose -f docker-compose.dev.yml build

      - name: Start Full Stack (Neo4j + FastAPI + Next.js)
        run: |
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for Neo4j and Services Health Check
        run: |
          echo "Waiting for services to spin up..."
          sleep 15
          docker compose -f docker-compose.dev.yml ps

      - name: Verify Backend Endpoint
        run: |
          curl -f http://localhost:8000/api/health || exit 1

      - name: Verify Frontend Endpoint
        run: |
          curl -f http://localhost:3000 || exit 1

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v

  # ---------------------------------------------------------------------------
  # 4. Production Docker Build Validation
  # ---------------------------------------------------------------------------
  build-docker-prod:
    name: Validate Production Containers Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Prod Containers
        run: |
          docker compose -f docker-compose.prod.yml build