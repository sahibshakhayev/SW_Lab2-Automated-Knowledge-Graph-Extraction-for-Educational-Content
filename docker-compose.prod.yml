services:
  neo4j:
    extends:
      file: docker-compose.yml
      service: neo4j
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kg_backend_prod
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    restart: always
    depends_on:
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kg_frontend_prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: always
    depends_on:
      - backend

volumes:
  neo4j_data: